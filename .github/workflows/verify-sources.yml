name: Verify against live sources

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: Re-verify the ephemeris against a fresh JPL Horizons epoch
        run: npm test --workspace @stargaze/core
        env:
          LIVE_VERIFY: '1'

      - name: Re-verify IGRF against NOAA's published WMM test values
        run: python tools/build_declination.py

      - name: Check whether the HYG or Stellarium source has changed upstream
        run: python tools/check_catalogue_hashes.py

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled source verification failed (run ${context.runId})`,
              body:
                'The monthly `verify-sources` workflow failed -- either the ephemeris no longer ' +
                `matches a live JPL Horizons epoch, IGRF drifted past NOAA's published test values, ` +
                'or an upstream catalogue source changed.\n\n' +
                `See the run for which step failed and why: ${runUrl}`,
            });
